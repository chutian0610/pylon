name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  boundary-checks:
    name: Boundary checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check SPI boundaries
        run: bash tools/check-spi-boundaries.sh

      - name: Check trait stability
        run: bash tools/check-trait-stability.sh

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/*

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Test workspace
        run: cargo test --workspace

  deny-check:
    name: Cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

  # fmt-check, clippy -D warnings:
  #   intentionally OFF. Pre-PR #10 main has 276 files of `cargo fmt`
  #   drift and 22 `clippy` errors (16 in pylon-plan tests, 6 in
  #   pylon-exchange/flight_server.rs). Enforcing either in CI would
  #   block every PR until a mechanical autofix lands. Track in the
  #   follow-up "mechanical autofix" PR (separate effort).
