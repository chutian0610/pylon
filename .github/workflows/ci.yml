name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  boundary-checks:
    name: Boundary checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check SPI boundaries
        run: bash tools/check-spi-boundaries.sh

      - name: Check trait stability
        run: bash tools/check-trait-stability.sh

  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install protoc
        # pylon-proto uses prost-build to compile proto/*.proto at
        # build time, which needs the protoc binary on PATH. The
        # ubuntu-latest runner has sudo without password for the
        # standard protobuf-compiler apt package.
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/*

      - name: Build workspace
        run: cargo build --workspace --all-targets

      - name: Generate sample parquet fixture
        # data/sample.parquet is .gitignored (see .gitignore line 7-8:
        # "/data/" and "**/*.parquet"); the run-test target reads it
        # via CARGO_MANIFEST_DIR-anchored sample_path(). tools/
        # gen-sample-data writes a deterministic 100k-row parquet
        # under data/; running it once before cargo test ensures
        # the file exists on the runner.
        run: cargo run --quiet -p gen-sample-data

      - name: Test workspace
        run: cargo test --workspace

  deny-check:
    name: Cargo-deny
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Run cargo-deny
        run: cargo deny check

  fmt-check:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  clippy:
    name: Clippy (-D warnings)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            crates/*

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
