syntax = "proto3";

package pylon;

// ---- worker ↔ coord control plane ----

service Worker {
  // Unary handshake: worker reports its Arrow Flight address and
  // gets back a stable worker_id. Worker then opens the bidi session.
  rpc RegisterWorker(RegisterWorkerRequest) returns (RegisterWorkerResponse);

  // The single bidi stream used for the lifetime of a worker connection.
  // Coord sends TaskRequest, worker streams TaskResponse back.
  rpc OpenSession (stream TaskResponse) returns (stream TaskRequest);
}

message RegisterWorkerRequest {
  // Host:port the worker is listening on for Arrow Flight
  // (peer-to-peer shuffle transport). Required for M3 cross-worker
  // exchange.
  string flight_addr = 1;
  // Optional: the gRPC address the worker is reachable at. For
  // diagnostics / debugging; not used for routing in M3 first cut.
  string grpc_addr = 2;
}

message RegisterWorkerResponse {
  // Coordinator-assigned worker id. Stable for the lifetime of the
  // session.
  uint64 worker_id = 1;
}

message TaskRequest {
  TaskSpec spec = 1;
}

message TaskResponse {
  uint64 task_id = 1;
  TaskState state = 2;
  uint64 rows_emitted = 3;

  // Arrow IPC streaming-encoded RecordBatch (0..N).
  // If state == DONE or FAILED, the stream is closed implicitly.
  bytes batch = 4;

  string message = 5;  // for FAILED: error msg

  // For STALLED: storage key of the spill file the coord should
  // pass to the retried attempt (RFC 0007 §3.5). Empty otherwise.
  string spill_handle = 6;
}

enum TaskState {
  TASK_RUNNING = 0;
  TASK_DONE = 1;
  TASK_FAILED = 2;
  TASK_CANCELLED = 3;
  TASK_STALLED = 4;
}

// ---- Shared message types ----

message TaskSpec {
  uint64 id = 1;
  uint64 query_id = 2;
  uint64 stage_id = 3;
  uint32 partition = 4;
  Fragment fragment = 5;
  repeated ExchangeSpec sources = 6;
  repeated ExchangeSpec sinks = 7;
  uint64 memory_budget_bytes = 8;
}

message Fragment {
  repeated OpSpec ops = 1;
  Distribution distribution = 2;
}

message OpSpec {
  string name = 1;
  map<string, string> config = 2;
}

enum Distribution {
  DISTRIB_SINGLE = 0;
  DISTRIB_PARTITIONED = 1;
  DISTRIB_BROADCAST = 2;
}

message ExchangeSpec {
  ExchangeKind kind = 1;
  string target_worker = 2;
  uint32 target_partition = 3;
  uint32 source_partition = 4;
}

enum ExchangeKind {
  EX_PARTITIONED = 0;
  EX_BROADCAST = 1;
  EX_GATHER = 2;
  EX_LOCAL = 3;
}
